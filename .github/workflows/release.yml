name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - run: bun run check
        env:
          LUAC: luac5.4
      - run: bun run package
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist-release/*.zip
          else
            gh release create "${GITHUB_REF_NAME}" dist-release/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        with:
          name: 402studio_bridge
          path: dist-release/*.zip
